# Install as:
# /www/server/panel/vhost/nginx/extension/htmlcss-to-framerf1-widget.g-m.dev/input-lab-hosted.conf
#
# The site's primary aaPanel vhost includes that extension directory from
# inside its `server {}` block. Keep limit_req_zone declarations in the
# separate http-context file.

add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'self' data: blob:; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'none'" always;
add_header Permissions-Policy "hid=(self), serial=(self), usb=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

location = /api/bridge {
    limit_req zone=input_lab_light_per_ip burst=10 nodelay;
    limit_conn input_lab_conn_per_ip 4;
    expires -1;

    proxy_pass http://127.0.0.1:9231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_buffering off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}

location = /api/compile {
    limit_req zone=input_lab_light_per_ip burst=5 nodelay;
    limit_conn input_lab_conn_per_ip 2;
    client_max_body_size 96k;
    client_body_timeout 10s;
    expires -1;

    proxy_pass http://127.0.0.1:9231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}

location = /api/render-v2/compile {
    limit_req zone=input_lab_heavy_per_ip burst=2 nodelay;
    limit_conn input_lab_conn_per_ip 2;
    client_max_body_size 96k;
    client_body_timeout 10s;
    expires -1;

    proxy_pass http://127.0.0.1:9231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 55s;
    proxy_read_timeout 55s;
    proxy_buffering off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}

location = /api/render-v2/simulate {
    # Normal UI replay is cache-backed and does not relaunch Chromium. A cache miss still uses
    # the same 55s upstream deadline and the Node process's one-job concurrency gate.
    limit_req zone=input_lab_light_per_ip burst=5 nodelay;
    limit_conn input_lab_conn_per_ip 2;
    client_max_body_size 96k;
    client_body_timeout 10s;
    expires -1;

    proxy_pass http://127.0.0.1:9231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 55s;
    proxy_read_timeout 55s;
    proxy_buffering off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}

location = /api/capture {
    limit_req zone=input_lab_heavy_per_ip burst=2 nodelay;
    limit_conn input_lab_conn_per_ip 2;
    client_max_body_size 96k;
    client_body_timeout 10s;
    expires -1;

    proxy_pass http://127.0.0.1:9231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 55s;
    proxy_read_timeout 55s;
    proxy_buffering off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}

location = /api/bundle {
    limit_req zone=input_lab_heavy_per_ip burst=2 nodelay;
    limit_conn input_lab_conn_per_ip 2;
    client_max_body_size 512k;
    client_body_timeout 10s;
    expires -1;

    proxy_pass http://127.0.0.1:9231;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 55s;
    proxy_read_timeout 55s;
    proxy_buffering off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}

# Fail closed: the hosted service never exposes /api/apply or arbitrary paths.
# Exact locations above win before this prefix location.
location ^~ /api/ {
    return 404;
}
