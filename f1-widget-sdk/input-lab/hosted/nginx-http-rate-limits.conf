# Install in the Nginx `http {}` context as:
# /www/server/panel/vhost/nginx/00-input-lab-rate-limits.conf
#
# aaPanel's stock /www/server/nginx/conf/nginx.conf includes
# /www/server/panel/vhost/nginx/*.conf from `http {}`. Confirm that fact with
# `/www/server/nginx/sbin/nginx -T` before installing this file.

limit_req_zone $binary_remote_addr zone=input_lab_light_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=input_lab_heavy_per_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=input_lab_conn_per_ip:10m;
