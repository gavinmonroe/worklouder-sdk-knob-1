<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="input-lab-session-token" content="__INPUT_LAB_SESSION_TOKEN__">
    <title>Input Lab</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="toolbar">
      <strong>Input Lab</strong>
      <span id="active-slot">Active slot: 1 · Working</span>
      <button id="compile" type="button">Compile</button>
      <button id="apply" class="primary" type="button">Apply / Push</button>
    </header>
    <main class="workspace">
      <section class="editors" aria-label="Scene source">
        <div class="settings">
          <label>Mode <select id="mode"><option value="semantic">Semantic CSS</option><option value="raster">Chromium raster</option></select></label>
          <label>FPS <input id="fps" type="number" min="1" max="10" step="0.5" value="5"></label>
          <label>Loop ms <input id="duration" type="number" min="100" max="10000" step="100" value="2000"></label>
          <label>Max bytes ≤128K <input id="max-bytes" type="number" min="65536" max="131072" step="1024" value="131072"></label>
          <label>State <select id="interaction"><option value="none">Default</option><option value="hover">Hover</option></select></label>
        </div>
        <label for="html-source">HTML</label>
        <textarea id="html-source" spellcheck="false" maxlength="131072"></textarea>
        <label for="css-source">CSS</label>
        <textarea id="css-source" spellcheck="false" maxlength="131072"></textarea>
      </section>
      <section class="device-column" aria-label="Device preview">
        <div class="device-frame"><canvas id="preview" width="100" height="310"></canvas></div>
        <output id="status">Ready · mock transport</output>
        <div id="capture-stats" class="capture-stats"></div>
        <div id="filmstrip" class="filmstrip" aria-label="Captured frames"></div>
      </section>
      <section class="slots" aria-label="Saved previews">
        <h2>Saved previews</h2>
        <div id="slot-list"></div>
      </section>
    </main>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
